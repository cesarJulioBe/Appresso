# ============================================================================
# Override de desarrollo con hot-reload
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   API con node --watch  -> http://localhost:3000
#   Vite dev server       -> http://localhost:5173
# ============================================================================
services:
  api:
    environment:
      NODE_ENV: development
    command: ["node", "--watch", "src/server.js"]
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ai_models:/app/src/infrastructure/ai/saved_models
      - api_logs:/app/logs

  frontend:
    image: node:22-alpine
    build: !reset null
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:${API_HOST_PORT:-3001}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: !override
      - "5173:5173"

volumes:
  frontend_node_modules:
