# ============================================================================
# Stack completo Appresso: PostgreSQL + API Express + Frontend (nginx)
# Uso: docker compose up -d --build   ->   http://localhost:8080
# ============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-appresso}
      TZ: America/Bogota
      PGTZ: America/Bogota
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/database/schema_completo_appresso.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: appresso-api
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-appresso}
      HMAC_SECRET: ${HMAC_SECRET:-cambiar_esta_llave_en_produccion}
      NODE_ENV: production
      PORT: 3000
      LOG_DIR: /app/logs
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ai_models:/app/src/infrastructure/ai/saved_models
      - api_logs:/app/logs
    ports:
      - "${API_HOST_PORT:-3001}:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: appresso-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
  ai_models:
  api_logs:
